name: Server health report checks

on:
  push:
    paths:
      - 'tools/server-health-report/**'
      - '.github/workflows/server-health-report.yml'
  pull_request:
    paths:
      - 'tools/server-health-report/**'
      - '.github/workflows/server-health-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Windows / ${{ matrix.shell }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Parser and behavioral tests
        run: ./tools/server-health-report/tests/Test-ServerHealthReport.ps1
      - name: Real local Windows collection
        run: ./tools/server-health-report/tests/Test-LocalCollection.ps1
